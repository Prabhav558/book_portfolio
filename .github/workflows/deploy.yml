name: Deploy to GitHub Pages

on:
  push:
    branches: [revamp]
  workflow_dispatch:
  # a nightly rebuild keeps the GitHub activity page current (GitHub runs scheduled workflows from the default branch only)
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Refresh GitHub activity
        # writes content/github.json; if it cannot reach GitHub it leaves the last good copy alone (tools/github.mjs)
        run: node tools/github.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_EXPORT: 1
          NEXT_BASE_PATH: /book_portfolio
          # the contact form's access key (web3forms.com). Public by design, but kept out of the repo as a secret
          NEXT_PUBLIC_FORM_KEY: ${{ secrets.NEXT_PUBLIC_FORM_KEY }}

      - uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
